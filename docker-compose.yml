version: '3.8'

services:
  # Training service
  training:
    build: .
    container_name: emotion-training
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    command: python src/train.py
    
  # API service
  api:
    build: .
    container_name: emotion-api
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    command: python api.py
    depends_on:
      - training
    restart: unless-stopped

networks:
  default:
    name: emotion-network
